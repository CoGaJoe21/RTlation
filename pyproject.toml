[project]
name = "rtlation"
version = "0.1.0"
description = "Real Time / Translation - lokale Echtzeit-Sprachuebersetzung"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "onnxruntime>=1.20",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
rtlation = "rtlation.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtlation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
